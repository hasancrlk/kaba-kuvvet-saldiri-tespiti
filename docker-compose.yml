services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authwatch
      POSTGRES_PASSWORD: authwatch
      POSTGRES_DB: authwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://authwatch:authwatch@db:5432/authwatch
      DETECT_THRESHOLD: "5"
      DETECT_WINDOW_SECONDS: "60"
    ports:
      - "8000:8000"

volumes:
  pgdata:
